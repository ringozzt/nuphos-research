<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuphos（团队 agent 工作区）· 交互思维导图</title>
<style>
  :root { --bg:#0f1419; --panel:#182028; --line:#2b3642; --text:#d7dee6; --dim:#8b98a5; --acc:#4cc38a; --warn:#f5a524; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { padding:28px 32px 8px; max-width:1100px; margin:0 auto; }
  header h1 { margin:0 0 6px; font-size:24px; }
  header p { margin:0; color:var(--dim); font-size:14px; }
  header a { color:var(--acc); text-decoration:none; }
  #tree { max-width:1100px; margin:0 auto; padding:16px 32px 64px; }
  ul { list-style:none; margin:0; padding-left:22px; border-left:1px solid var(--line); }
  #tree > ul { border-left:none; padding-left:0; }
  li { margin:6px 0; }
  .node { display:inline-block; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:7px 12px; font-size:14px; cursor:pointer; user-select:none; }
  .node:hover { border-color:var(--acc); }
  .node .tag { font-size:11px; border-radius:4px; padding:1px 6px; margin-left:8px; vertical-align:1px; }
  .tag-p { background:#123a2a; color:var(--acc); }
  .tag-s { background:#3a2f12; color:var(--warn); }
  .node .caret { color:var(--dim); margin-right:6px; font-size:11px; }
  .collapsed > ul { display:none; }
  .leaf { cursor:default; }
  .leaf:hover { border-color:var(--line); }
  .legend { max-width:1100px; margin:0 auto; padding:0 32px; color:var(--dim); font-size:12px; }
  footer { max-width:1100px; margin:0 auto; padding:0 32px 40px; color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Nuphos（团队 agent 工作区）· 交互思维导图</h1>
  <p>点击节点展开 / 折叠 · 数据来源见 <a href="https://github.com/ringozzt/nuphos-research">nuphos-research 仓库 README</a> · 调研时间 2026-10-11</p>
</header>
<p class="legend"><span class="tag tag-p" style="font-size:11px;border-radius:4px;padding:1px 6px;">P</span> 一手来源（仓库/官方文档）　<span class="tag tag-s" style="font-size:11px;border-radius:4px;padding:1px 6px;">S</span> 二手来源（媒体/目录站）</p>
<div id="tree"><ul id="root"></ul></div>
<footer>独立第三方调研，与 nuphos/nuphos 项目无关。star 数为快照，持续变化中。</footer>
<script>
const T = (t, tag, children) => ({t, tag, c: children || []});
const data = [
  T("是什么", "P", [
    T("Zeabur Inc. 的团队 agent 工作区"),
    T("会话 = 多人可加入的房间；会话比机器长寿"),
    T("团队共享技能、工具连接与记忆"),
  ]),
  T("时间线：产品不年轻、仓库才年轻", null, [
    T("2026 夏托管产品以 Atlas / DevOps 工作区面世", "S"),
    T("Product Hunt 2026-08 上线", "S"),
    T("2026-10-01 开源仓库创建 + 重新定位", "P"),
    T("45 stars / 152 commits / 21 releases，全线 <1.0", "P"),
    T("Zeabur 累计融资约 $2.3M（PitchBook）", "S"),
  ]),
  T("架构", "P", [
    T("backend：Bun/Hono，MongoDB + S3(RustFS)，托管版有 Redis"),
    T("desktop：Electron/Vite/React，工作区本体"),
    T("runtime（核心）：长寿命容器内恰一个 agent"),
    T("OpenAB 网关经 ACP-over-WebSocket 驱动会话", "P"),
    T("适配器打补丁并以 SHA-256 钉住上游，升级即断构建"),
    T("iOS：SwiftUI 接续会话；cli：nuphos agent 把本机变成本地 agent"),
    T("会话状态在后端，runtime 可替换 —— 故可跨机迁移"),
  ]),
  T("ACP 赌注", null, [
    T("ACP 由 Zed 2025-08 发起，多数人用作编辑器↔本地 stdio", "S"),
    T("Nuphos 把它改造成网络化的团队 runtime 总线"),
    T("已支持 5 种 agent：Claude Code / Codex / Grok Build / Antigravity / OpenCode"),
  ]),
  T("认证：用你自己的订阅", "P", [
    T("runtime 内由用户本人登录，凭据只留在 runtime 卷"),
    T("Nuphos 不收集 API key，无额外模型费"),
  ]),
  T("产品理念", "P", [
    T("会话即房间：权限两级（Can reply / Can manage）"),
    T("技能授权一次、全队同步"),
    T("团队记忆内置（数据表示未披露，未核实）"),
    T("cron / webhook 触发器；Slack/Discord 入频道"),
    T("工作区即运维台：面板非截图，agent 直操 AWS/GCP/K8s（BYOC）"),
  ]),
  T("许可：比标签干净", "P", [
    T("根 LICENSE 逐字核对为标准 Apache-2.0，无附加条款"),
    T("“Other (NOASSERTION)”是探测失败，非 source-available 证据"),
    T("闭源在仓库外：Android 客户端、托管运维层、多团队单实例、商标"),
  ]),
  T("竞争格局", null, [
    T("paperclip：治理控制面（组织图/预算/心跳），执行面 vs 治理面，非同类", "S"),
    T("Multica：看板异步协作，团队论最接近"),
    T("Terragon 形态最像，已于 2026-01 关停（先例警告）", "S"),
    T("厂商云功能在吸收“会话比笔记本长寿”，但是单厂商围墙"),
  ]),
  T("风险", null, [
    T("共享会话 = 共享权限；团队密钥是云凭据前唯一屏障", "P"),
    T("本地 agent：队友消息以机主身份执行命令", "P"),
    T("多人共驾一份个人订阅：合规定性连官方文本都未明"),
    T("全线 <1.0、高 churn、Atlas 代号残留"),
  ]),
];
function render(nodes, parent) {
  nodes.forEach(n => {
    const li = document.createElement("li");
    const div = document.createElement("div");
    div.className = "node" + (n.c.length ? "" : " leaf");
    div.innerHTML = (n.c.length ? '<span class="caret">▾</span>' : "") +
      n.t + (n.tag ? `<span class="tag tag-${n.tag.toLowerCase()}">${n.tag}</span>` : "");
    if (n.c.length) div.onclick = e => {
      if (e.target.closest(".node") !== div) return;
      li.classList.toggle("collapsed");
      div.querySelector(".caret").textContent = li.classList.contains("collapsed") ? "▸" : "▾";
    };
    li.appendChild(div);
    if (n.c.length) { const ul = document.createElement("ul"); render(n.c, ul); li.appendChild(ul); }
    parent.appendChild(li);
  });
}
render(data, document.getElementById("root"));
</script>
</body>
</html>
